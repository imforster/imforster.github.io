<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4880f;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Arrow line -->
  <line x1="60" y1="260" x2="740" y2="260" stroke="#ccc" stroke-width="2"/>
  <polygon points="740,255 755,260 740,265" fill="#ccc"/>

  <!-- Labels below arrow -->
  <text x="60" y="290" font-size="11" fill="#666">Lower abstraction</text>
  <text x="660" y="290" font-size="11" fill="#666">Higher abstraction</text>

  <!-- Steps -->
  <rect x="40" y="200" width="100" height="45" rx="6" fill="#1e3a5f" opacity="0.3"/>
  <text x="90" y="227" font-size="12" fill="#1e3a5f" text-anchor="middle">Machine Code</text>

  <rect x="160" y="170" width="100" height="45" rx="6" fill="#1e3a5f" opacity="0.4"/>
  <text x="210" y="197" font-size="12" fill="#1e3a5f" text-anchor="middle">Assembly</text>

  <rect x="280" y="140" width="100" height="45" rx="6" fill="#1e3a5f" opacity="0.55"/>
  <text x="330" y="160" font-size="12" fill="#1e3a5f" text-anchor="middle">High-Level</text>
  <text x="330" y="175" font-size="12" fill="#1e3a5f" text-anchor="middle">Languages</text>

  <rect x="400" y="110" width="100" height="45" rx="6" fill="#1e3a5f" opacity="0.7"/>
  <text x="450" y="137" font-size="12" fill="#1e3a5f" text-anchor="middle">Frameworks</text>

  <rect x="520" y="80" width="100" height="45" rx="6" fill="#1e3a5f" opacity="0.85"/>
  <text x="570" y="100" font-size="12" fill="#1e3a5f" text-anchor="middle">Cloud &amp;</text>
  <text x="570" y="115" font-size="12" fill="#1e3a5f" text-anchor="middle">Containers</text>

  <rect x="640" y="45" width="120" height="50" rx="6" fill="url(#grad1)"/>
  <text x="700" y="70" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Intent</text>
  <text x="700" y="86" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Engineering</text>

  <!-- Title -->
  <text x="400" y="30" font-size="16" fill="#333" text-anchor="middle" font-weight="600">The Abstraction Ladder</text>
</svg>
