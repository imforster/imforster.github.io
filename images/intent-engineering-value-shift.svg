<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="system-ui, -apple-system, sans-serif">
  <!-- Title -->
  <text x="400" y="30" font-size="16" fill="#333" text-anchor="middle" font-weight="600">Where Engineering Time Goes</text>

  <!-- Before label -->
  <text x="200" y="65" font-size="14" fill="#555" text-anchor="middle" font-weight="500">Before AI</text>

  <!-- Before bar - Implementation heavy -->
  <rect x="50" y="80" width="300" height="40" rx="4" fill="#eee" stroke="#ccc"/>
  <rect x="50" y="80" width="60" height="40" rx="4" fill="#d4880f"/>
  <rect x="110" y="80" width="240" height="40" fill="#1e3a5f"/>
  <rect x="347" y="80" width="3" height="40" rx="0" fill="#1e3a5f"/>
  <text x="80" y="104" font-size="11" fill="#fff" text-anchor="middle">Intent</text>
  <text x="230" y="104" font-size="11" fill="#fff" text-anchor="middle">Implementation</text>

  <!-- After label -->
  <text x="200" y="155" font-size="14" fill="#555" text-anchor="middle" font-weight="500">With AI</text>

  <!-- After bar - Intent heavy -->
  <rect x="50" y="170" width="300" height="40" rx="4" fill="#eee" stroke="#ccc"/>
  <rect x="50" y="170" width="180" height="40" rx="4" fill="#d4880f"/>
  <rect x="230" y="170" width="60" height="40" fill="#1e3a5f"/>
  <rect x="290" y="170" width="60" height="40" fill="#4a90a4" rx="0"/>
  <rect x="347" y="170" width="3" height="40" rx="0" fill="#4a90a4"/>
  <text x="140" y="194" font-size="11" fill="#fff" text-anchor="middle">Intent &amp; Specification</text>
  <text x="260" y="194" font-size="11" fill="#fff" text-anchor="middle">Impl</text>
  <text x="320" y="194" font-size="11" fill="#fff" text-anchor="middle">Verify</text>

  <!-- Legend -->
  <rect x="500" y="90" width="16" height="16" rx="3" fill="#d4880f"/>
  <text x="524" y="103" font-size="12" fill="#555">Defining intent &amp; specs</text>

  <rect x="500" y="118" width="16" height="16" rx="3" fill="#1e3a5f"/>
  <text x="524" y="131" font-size="12" fill="#555">Writing implementation</text>

  <rect x="500" y="146" width="16" height="16" rx="3" fill="#4a90a4"/>
  <text x="524" y="159" font-size="12" fill="#555">Testing &amp; verification</text>

  <!-- Insight -->
  <text x="400" y="260" font-size="13" fill="#666" text-anchor="middle" font-style="italic">The work doesn't disappear. The bottleneck moves.</text>
</svg>
